name: Build, test and deploy

on:
  push:
    branches:
      - master
      - ci
  pull_request:
    branches:
      - master

# Cancel existing runs when a new commit is pushed to the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-deploy:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu
          - {os: "ubuntu-latest", cxx: "g++-14"}
          - {os: "ubuntu-latest", cxx: "clang++"}
          # macOS aarch64
          - {os: "macos-latest", cxx: "g++-15"}
          - {os: "macos-latest", cxx: "clang++"}
          # macOS x86-64
          # macos-15-intel is probably the last supported macOS x86-64 runner
          # https://github.com/actions/runner-images/issues/13074
          - {os: "macos-15-intel", cxx: "g++-15"}
          - {os: "macos-15-intel", cxx: "clang++"}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v7

    - name: Install Boost, GMP, and Eigen 3
      run: |
           if [[ "${{ matrix.os }}" == ubuntu-* ]]; then
             sudo apt-get update -q
             sudo apt-get install libboost-dev libgmp-dev libeigen3-dev
           else
             brew update
             brew install boost eigen
           fi

    - name: Set up Python 3.14
      if: startsWith(matrix.cxx, 'clang')
      uses: actions/setup-python@v7
      with:
        python-version: 3.14

    - name: Install cppcheck
      if: startsWith(matrix.os, 'ubuntu')
      run: sudo apt-get install cppcheck

    - name: Install Sphinx and Read the Docs Sphinx Theme
      if: startsWith(matrix.cxx, 'clang')
      run: |
           python -m pip install --upgrade pip
           pip install sphinx sphinx-rtd-theme myst-parser

    - name: Build libcommute
      run: |
           mkdir installed
           mkdir build && cd build

           USE_GMPXX=ON
           if [[ "${{ matrix.os }}" == ubuntu* ]]; then
             STATIC_ANALYSIS=ON
           else
             STATIC_ANALYSIS=OFF

             # homebrew's GMP seems to be incompatible with gcc
             # (missing symbols, possibly libraries built with -stdlib=libc++)
             if [[ "${{ matrix.cxx }}" == g++* ]]; then
               USE_GMPXX=OFF
             fi
           fi

           if [[ "${{ matrix.cxx }}" == clang* ]]; then
             DOCS=ON
           else
             DOCS=OFF
           fi
           CXX="${{ matrix.cxx }}" cmake ..                       \
             -DCMAKE_BUILD_TYPE=Debug                                          \
             -DCMAKE_INSTALL_PREFIX=${GITHUB_WORKSPACE}/installed              \
             -DCMAKE_CXX_FLAGS="-march=native"                                 \
             -DSTATIC_ANALYSIS=${STATIC_ANALYSIS}                              \
             -DTESTS=ON                                                        \
             -DEXAMPLES=ON                                                     \
             -DUSE_GMPXX=${USE_GMPXX}                                          \
             -DDOCUMENTATION=${DOCS}
           make -j3 VERBOSE=1

    - name: Test libcommute
      run: |
           cd ${GITHUB_WORKSPACE}/build
           CTEST_OUTPUT_ON_FAILURE=1 make test
    - name: Install libcommute
      run: |
           cd ${GITHUB_WORKSPACE}/build
           make install

    - name: Deploy documentation
      if: |
          github.ref == 'refs/heads/master' &&
          startsWith(matrix.os, 'ubuntu') &&
          startsWith(matrix.cxx, 'clang')
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        branch: gh-pages
        token: ${{ secrets.GITHUB_TOKEN }}
        folder: installed/share/doc/libcommute

